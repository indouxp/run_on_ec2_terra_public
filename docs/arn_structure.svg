<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" font-family="Helvetica, Arial, sans-serif">
  <!-- Last updated: 2026-06-22 11:20:30 -->
  <!-- 背景 -->
  <rect x="0" y="0" width="820" height="470" fill="#ffffff"/>

  <!-- タイトル -->
  <text x="40" y="40" font-size="20" font-weight="bold" fill="#1a2330">VPC ARN の構造</text>
  <text x="40" y="64" font-size="13" fill="#5b6b7b">ARN は末尾に VPC ID を内包し、アカウント・リージョン等を付加して世界中で一意にした識別子</text>

  <!-- 全体ARN -->
  <rect x="40" y="84" width="740" height="38" rx="6" fill="#eef3f8" stroke="#c7d4e0"/>
  <text x="410" y="109" font-size="13.5" font-family="Consolas, 'Courier New', monospace" fill="#1a2330" text-anchor="middle">arn:aws:ec2:ap-northeast-1:XXXXXXXXXXXX:vpc/vpc-0a1b2c3d4e5f6789</text>

  <!-- 行テンプレート: 値ボックス + 説明 -->
  <!-- row1 -->
  <rect x="40" y="150" width="300" height="30" rx="4" fill="#f4f6f8" stroke="#d6dee6"/>
  <text x="52" y="170" font-size="13" font-family="Consolas, 'Courier New', monospace" fill="#1a2330">arn</text>
  <text x="360" y="170" font-size="13" fill="#33414f">固定の接頭辞（必ず arn）</text>

  <!-- row2 -->
  <rect x="40" y="188" width="300" height="30" rx="4" fill="#f4f6f8" stroke="#d6dee6"/>
  <text x="52" y="208" font-size="13" font-family="Consolas, 'Courier New', monospace" fill="#1a2330">aws</text>
  <text x="360" y="208" font-size="13" fill="#33414f">パーティション（aws / aws-cn / aws-us-gov）</text>

  <!-- row3 -->
  <rect x="40" y="226" width="300" height="30" rx="4" fill="#f4f6f8" stroke="#d6dee6"/>
  <text x="52" y="246" font-size="13" font-family="Consolas, 'Courier New', monospace" fill="#1a2330">ec2</text>
  <text x="360" y="246" font-size="13" fill="#33414f">サービス名（VPC は EC2 サービス配下）</text>

  <!-- row4 -->
  <rect x="40" y="264" width="300" height="30" rx="4" fill="#f4f6f8" stroke="#d6dee6"/>
  <text x="52" y="284" font-size="13" font-family="Consolas, 'Courier New', monospace" fill="#1a2330">ap-northeast-1</text>
  <text x="360" y="284" font-size="13" fill="#33414f">リージョン</text>

  <!-- row5 -->
  <rect x="40" y="302" width="300" height="30" rx="4" fill="#f4f6f8" stroke="#d6dee6"/>
  <text x="52" y="322" font-size="13" font-family="Consolas, 'Courier New', monospace" fill="#1a2330">XXXXXXXXXXXX</text>
  <text x="360" y="322" font-size="13" fill="#33414f">アカウント ID（例ではマスク）</text>

  <!-- row6 -->
  <rect x="40" y="340" width="300" height="30" rx="4" fill="#f4f6f8" stroke="#d6dee6"/>
  <text x="52" y="360" font-size="13" font-family="Consolas, 'Courier New', monospace" fill="#1a2330">vpc</text>
  <text x="360" y="360" font-size="13" fill="#33414f">リソース種別</text>

  <!-- row7 (highlight = VPC ID) -->
  <rect x="40" y="378" width="300" height="30" rx="4" fill="#fff3d6" stroke="#e6b34d" stroke-width="1.5"/>
  <text x="52" y="398" font-size="13" font-family="Consolas, 'Courier New', monospace" fill="#7a5300">vpc-0a1b2c3d4e5f6789</text>
  <text x="360" y="398" font-size="13" font-weight="bold" fill="#7a5300">リソース ID（＝ VPC ID）</text>

  <!-- 注記 -->
  <text x="40" y="440" font-size="12" fill="#8a97a4">※ ハイライト部が VPC ID。ARN はこの ID を内包している。</text>
</svg>
