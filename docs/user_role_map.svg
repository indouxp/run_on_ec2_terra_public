<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" font-family="'Helvetica Neue',Arial,'Hiragino Kaku Gothic ProN','Meiryo',sans-serif">
  <!-- Last updated: 2026-09-22 14:00:09（readonly と operate の説明を現行に合わせる） -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#555"/>
    </marker>
  </defs>

  <text x="440" y="32" text-anchor="middle" font-size="21" font-weight="bold" fill="#222">ユーザー・ロール・S3 の関係（ts-030）</text>
  <text x="440" y="55" text-anchor="middle" font-size="12.5" fill="#666">ユーザーは最小権限（role-admin=IAM 操作のみ／build・operate=AssumeRole のみ）／実操作は借りたロール／ts-030-usr-* はグループ未使用</text>

  <!-- admin -->
  <rect x="330" y="74" width="220" height="52" rx="10" fill="#f3e8fb" stroke="#7a3fb3" stroke-width="2"/>
  <text x="440" y="96" text-anchor="middle" font-size="13" font-weight="bold" fill="#5a2a86">ts-usr-admin（Administrator）</text>
  <text x="440" y="115" text-anchor="middle" font-size="11" fill="#5a2a86">3ユーザーの作成・緊急時のみ / キーなし</text>

  <!-- readonly（共用・参照のみ） -->
  <rect x="620" y="74" width="220" height="52" rx="10" fill="#f4f4f4" stroke="#888" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="730" y="96" text-anchor="middle" font-size="13" font-weight="bold" fill="#555">ts-usr-readonly</text>
  <text x="730" y="115" text-anchor="middle" font-size="11" fill="#555">共用・参照のみ（in/out は Deny で不可）</text>

  <!-- users row -->
  <g>
    <rect x="40" y="170" width="240" height="66" rx="10" fill="#eef4fb" stroke="#2f6db3" stroke-width="2"/>
    <text x="160" y="194" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f4e79">ts-030-usr-role-admin</text>
    <text x="160" y="213" text-anchor="middle" font-size="11" fill="#333">IAM 直接操作（bootstrap）</text>
    <text x="160" y="228" text-anchor="middle" font-size="10.5" fill="#777">ts-030-* ロールの作成/削除のみ</text>

    <rect x="320" y="170" width="240" height="66" rx="10" fill="#eef4fb" stroke="#2f6db3" stroke-width="2"/>
    <text x="440" y="194" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f4e79">ts-030-usr-build</text>
    <text x="440" y="213" text-anchor="middle" font-size="11" fill="#333">sts:AssumeRole のみ</text>
    <text x="440" y="228" text-anchor="middle" font-size="10.5" fill="#777">infra・backend を実行</text>

    <rect x="600" y="170" width="240" height="66" rx="10" fill="#eef4fb" stroke="#2f6db3" stroke-width="2"/>
    <text x="720" y="194" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f4e79">ts-030-usr-operate</text>
    <text x="720" y="213" text-anchor="middle" font-size="11" fill="#333">sts:AssumeRole のみ</text>
    <text x="720" y="228" text-anchor="middle" font-size="10.5" fill="#777">データ運用（tool/*.sh）</text>
  </g>

  <line x1="440" y1="126" x2="160" y2="168" stroke="#7a3fb3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="440" y1="126" x2="440" y2="168" stroke="#7a3fb3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="440" y1="126" x2="720" y2="168" stroke="#7a3fb3" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="250" y="150" text-anchor="middle" font-size="10" fill="#7a3fb3">作成(1回)</text>

  <!-- roles row -->
  <rect x="320" y="290" width="240" height="60" rx="10" fill="#fdf3e8" stroke="#c07a1e" stroke-width="2"/>
  <text x="440" y="314" text-anchor="middle" font-size="13" font-weight="bold" fill="#a5641a">ts-030-role-build</text>
  <text x="440" y="333" text-anchor="middle" font-size="10.5" fill="#333">6サービス限定の構築権限</text>

  <rect x="600" y="290" width="240" height="60" rx="10" fill="#fdf3e8" stroke="#c07a1e" stroke-width="2"/>
  <text x="720" y="314" text-anchor="middle" font-size="13" font-weight="bold" fill="#a5641a">ts-030-role-operate</text>
  <text x="720" y="333" text-anchor="middle" font-size="10.5" fill="#333">in/out のオブジェクト操作のみ</text>

  <line x1="160" y1="236" x2="380" y2="288" stroke="#555" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="250" y="268" text-anchor="middle" font-size="10" fill="#555">直接実行</text>
  <line x1="440" y1="236" x2="440" y2="288" stroke="#555" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="470" y="266" text-anchor="middle" font-size="10" fill="#555">AssumeRole</text>
  <line x1="720" y1="236" x2="720" y2="288" stroke="#555" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="750" y="266" text-anchor="middle" font-size="10" fill="#555">AssumeRole</text>

  <!-- targets row -->
  <rect x="300" y="405" width="280" height="56" rx="10" fill="#eafaf0" stroke="#2e8b57" stroke-width="2"/>
  <text x="440" y="428" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e6b41">VPC / S3 / Lambda / EC2 …</text>
  <text x="440" y="447" text-anchor="middle" font-size="10.5" fill="#333">infra のリソース（作成/破棄）</text>

  <rect x="600" y="405" width="240" height="56" rx="10" fill="#eafaf0" stroke="#2e8b57" stroke-width="2"/>
  <text x="720" y="428" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e6b41">S3 in / out オブジェクト</text>
  <text x="720" y="447" text-anchor="middle" font-size="10.5" fill="#333">cp / rm（Deny フェンスで境界）</text>

  <!-- state バケット（常設） -->
  <rect x="40" y="405" width="240" height="56" rx="10" fill="#eafaf0" stroke="#2e8b57" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="160" y="428" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#1e6b41">ts-030-bkt-tfstate</text>
  <text x="160" y="447" text-anchor="middle" font-size="10.5" fill="#333">infra の state（常設・backend で作成）</text>
  <line x1="380" y1="350" x2="200" y2="403" stroke="#2e8b57" stroke-width="1.6" marker-end="url(#arrow)"/>

  <line x1="440" y1="350" x2="440" y2="403" stroke="#2e8b57" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="720" y1="350" x2="720" y2="403" stroke="#2e8b57" stroke-width="1.6" marker-end="url(#arrow)"/>

  <text x="440" y="500" text-anchor="middle" font-size="11.5" fill="#1e6b41">S3 アクセス = ①IAM インライン(許可) ＋ ②バケットポリシー Deny フェンス(境界) の多層防御</text>
  <text x="440" y="522" text-anchor="middle" font-size="11" fill="#666">Deny は data 操作のみ対象（管理系は除外）→ role-build は S3 を管理でき、承認外は弾かれる</text>
</svg>
