<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="'Helvetica Neue',Arial,'Hiragino Kaku Gothic ProN','Meiryo',sans-serif">
  <!-- Last updated: 2026-09-23 01:07:55（新規作成：Terraform state の置き場所と保護の構成図） -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#555"/>
    </marker>
  </defs>

  <text x="450" y="32" text-anchor="middle" font-size="21" font-weight="bold" fill="#222">Terraform state の置き場所と保護（ts-030）</text>
  <text x="450" y="55" text-anchor="middle" font-size="12.5" fill="#666">infra/ の state は S3 に置き、構築ロール経由でだけ読み書きします。bootstrap / backend の state はローカルです</text>

  <!-- ルートモジュール（左列） -->
  <text x="150" y="92" text-anchor="middle" font-size="13" font-weight="bold" fill="#444">ルートモジュール</text>

  <rect x="40" y="105" width="220" height="70" rx="10" fill="#f4f4f4" stroke="#888" stroke-width="1.5"/>
  <text x="150" y="128" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">infra/bootstrap/</text>
  <text x="150" y="147" text-anchor="middle" font-size="11" fill="#333">構築ロールを作る</text>
  <text x="150" y="164" text-anchor="middle" font-size="10.5" fill="#777">state：ローカル（terraform.tfstate）</text>

  <rect x="40" y="195" width="220" height="70" rx="10" fill="#f4f4f4" stroke="#888" stroke-width="1.5"/>
  <text x="150" y="218" text-anchor="middle" font-size="13" font-weight="bold" fill="#333">infra/backend/</text>
  <text x="150" y="237" text-anchor="middle" font-size="11" fill="#333">state 用バケットを作る（常設）</text>
  <text x="150" y="254" text-anchor="middle" font-size="10.5" fill="#777">state：ローカル（terraform.tfstate）</text>

  <rect x="40" y="315" width="220" height="80" rx="10" fill="#eef4fb" stroke="#2f6db3" stroke-width="2"/>
  <text x="150" y="340" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f4e79">infra/</text>
  <text x="150" y="359" text-anchor="middle" font-size="11" fill="#333">VPC・S3・Lambda・IAM・監視</text>
  <text x="150" y="377" text-anchor="middle" font-size="10.5" fill="#1f4e79">backend "s3"（use_lockfile = true）</text>

  <!-- 認証（中央列） -->
  <rect x="330" y="315" width="200" height="56" rx="10" fill="#eef4fb" stroke="#2f6db3" stroke-width="2"/>
  <text x="430" y="338" text-anchor="middle" font-size="13" font-weight="bold" fill="#1f4e79">ts-030-usr-build</text>
  <text x="430" y="357" text-anchor="middle" font-size="11" fill="#333">sts:AssumeRole のみ</text>

  <rect x="330" y="420" width="200" height="70" rx="10" fill="#fdf3e8" stroke="#c07a1e" stroke-width="2"/>
  <text x="430" y="443" text-anchor="middle" font-size="13" font-weight="bold" fill="#a5641a">ts-030-role-build</text>
  <text x="430" y="462" text-anchor="middle" font-size="10.5" fill="#333">state の Get / Put・.tflock の削除</text>
  <text x="430" y="479" text-anchor="middle" font-size="10.5" fill="#b03a2e">旧版の削除は明示 Deny</text>

  <!-- state 用バケット（右列） -->
  <rect x="600" y="160" width="270" height="330" rx="10" fill="#eafaf0" stroke="#2e8b57" stroke-width="2"/>
  <text x="735" y="185" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1e6b41">S3：ts-030-bkt-tfstate</text>

  <rect x="620" y="200" width="230" height="60" rx="8" fill="#ffffff" stroke="#2e8b57" stroke-width="1.2"/>
  <text x="735" y="222" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1e6b41">infra/terraform.tfstate</text>
  <text x="735" y="240" text-anchor="middle" font-size="10.5" fill="#333">現行版 ＋ 旧版（90 日で自動削除）</text>
  <text x="735" y="254" text-anchor="middle" font-size="10" fill="#777">バージョニング有効</text>

  <rect x="620" y="272" width="230" height="46" rx="8" fill="#ffffff" stroke="#2e8b57" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="735" y="292" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1e6b41">infra/terraform.tfstate.tflock</text>
  <text x="735" y="309" text-anchor="middle" font-size="10.5" fill="#333">plan / apply の実行中だけ存在（排他）</text>

  <text x="735" y="342" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#1e6b41">保護</text>
  <text x="630" y="362" font-size="10.5" fill="#333">・prevent_destroy（Terraform から削除不可）</text>
  <text x="630" y="380" font-size="10.5" fill="#333">・force_destroy なし（中身ごとは消えない）</text>
  <text x="630" y="398" font-size="10.5" fill="#333">・SSE-S3 ＋ backend の encrypt = true</text>
  <text x="630" y="416" font-size="10.5" fill="#333">・パブリックアクセスブロック 4 項目</text>
  <text x="630" y="434" font-size="10.5" fill="#333">・BucketOwnerEnforced（ACL 無効）</text>
  <text x="630" y="452" font-size="10.5" fill="#333">・TLS 以外のアクセスを Deny</text>
  <text x="630" y="470" font-size="10.5" fill="#333">・破棄・再作成サイクルの対象外（常設）</text>

  <!-- 矢印 -->
  <line x1="260" y1="350" x2="328" y2="345" stroke="#555" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="294" y="336" text-anchor="middle" font-size="10" fill="#555">profile</text>
  <line x1="430" y1="371" x2="430" y2="418" stroke="#555" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="470" y="400" text-anchor="middle" font-size="10" fill="#555">AssumeRole</text>
  <line x1="530" y1="445" x2="618" y2="240" stroke="#2e8b57" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="560" y="330" text-anchor="middle" font-size="10" fill="#2e8b57">読み書き</text>
  <line x1="530" y1="460" x2="618" y2="300" stroke="#2e8b57" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="590" y="400" text-anchor="middle" font-size="10" fill="#2e8b57">ロック</text>

  <line x1="260" y1="230" x2="598" y2="200" stroke="#888" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
  <text x="430" y="206" text-anchor="middle" font-size="10" fill="#777">作成（初回 1 回・構築ロールで apply）</text>
  <polyline points="40,140 24,140 24,455 328,455" fill="none" stroke="#888" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
  <text x="176" y="448" text-anchor="middle" font-size="10" fill="#777">作成（ts-030-usr-role-admin で apply）</text>

  <!-- 注記 -->
  <text x="450" y="535" text-anchor="middle" font-size="11.5" fill="#1e6b41">ロックは S3 上の .tflock オブジェクトで行います（DynamoDB 不要。Terraform 1.10 以上）</text>
  <text x="450" y="556" text-anchor="middle" font-size="11" fill="#666">参照・旧版の取得は ts-usr-readonly でもできます。bootstrap を破棄している間は構築ロールが無いため、infra の state も読めません</text>
</svg>
